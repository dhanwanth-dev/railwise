<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 340" role="img" aria-label="Constraint priority order">
  <rect width="1100" height="340" rx="18" fill="#0b1520"/>
  <text x="36" y="40" fill="#5eead4" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" letter-spacing="1.5">NON-NEGOTIABLE PRIORITY</text>
  <text x="36" y="68" fill="#f8fafc" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="700">If a higher row fires, lower rows do not get a vote.</text>

  <g font-family="Inter, system-ui, sans-serif">
    <rect x="36" y="96" width="1028" height="44" rx="10" fill="#7f1d1d"/>
    <text x="56" y="124" fill="#fecaca" font-size="15" font-weight="700">1  Stop  ·  stolen, lost, revoked, kill switch</text>

    <rect x="36" y="148" width="1028" height="44" rx="10" fill="#9a3412"/>
    <text x="56" y="176" fill="#ffedd5" font-size="15" font-weight="700">2  Dunning  ·  PDN miss, expired token, customer cancelled, dead mandate</text>

    <rect x="36" y="200" width="1028" height="44" rx="10" fill="#1e3a8a"/>
    <text x="56" y="228" fill="#dbeafe" font-size="15" font-weight="700">3  Delay or switch  ·  UPI cooldown, attempt budget, issuer outage, velocity</text>

    <rect x="36" y="252" width="1028" height="44" rx="10" fill="#134e4a"/>
    <text x="56" y="280" fill="#ccfbf1" font-size="15" font-weight="700">4  Recoverability and timing  ·  only inside the remaining legal set</text>
  </g>
  <text x="36" y="320" fill="#94a3b8" font-family="Inter, system-ui, sans-serif" font-size="13">This is why turning compliance off can raise recovery while creating wasted hard retries.</text>
</svg>
