<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 260" role="img" aria-label="How a single failure is decided">
  <rect width="1100" height="260" rx="18" fill="#f8fafc"/>
  <rect x="1" y="1" width="1098" height="258" rx="18" fill="none" stroke="#e2e8f0"/>
  <text x="36" y="40" fill="#0f172a" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="700">How a single failure is decided</text>
  <text x="36" y="64" fill="#64748b" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">One payment in. One bounded action out. Compliance gate sits in the middle.</text>

  <g font-family="ui-sans-serif, system-ui, sans-serif" text-anchor="middle">
    <rect x="30" y="96" width="140" height="70" rx="10" fill="#0f766e"/>
    <text x="100" y="126" fill="#fff" font-size="13" font-weight="700">Failed debit</text>
    <text x="100" y="146" fill="#ccfbf1" font-size="11">UPI or card</text>

    <rect x="200" y="96" width="140" height="70" rx="10" fill="#334155"/>
    <text x="270" y="126" fill="#fff" font-size="13" font-weight="700">Normalize</text>
    <text x="270" y="146" fill="#e2e8f0" font-size="11">rail + ISO</text>

    <rect x="370" y="70" width="130" height="54" rx="10" fill="#0f766e"/>
    <text x="435" y="102" fill="#fff" font-size="12" font-weight="700">Clear code</text>

    <rect x="370" y="138" width="130" height="54" rx="10" fill="#1d4ed8"/>
    <text x="435" y="170" fill="#fff" font-size="12" font-weight="700">Ambiguous</text>

    <rect x="540" y="96" width="150" height="70" rx="10" fill="#b45309"/>
    <text x="615" y="126" fill="#fff" font-size="13" font-weight="700">Constraint gate</text>
    <text x="615" y="146" fill="#ffedd5" font-size="11">13 NPCI / RBI rules</text>

    <rect x="720" y="70" width="150" height="54" rx="10" fill="#991b1b"/>
    <text x="795" y="102" fill="#fff" font-size="12" font-weight="700">Forced action</text>

    <rect x="720" y="138" width="150" height="54" rx="10" fill="#0e7490"/>
    <text x="795" y="170" fill="#fff" font-size="12" font-weight="700">Policy + timing</text>

    <rect x="900" y="96" width="160" height="70" rx="10" fill="#4338ca"/>
    <text x="980" y="126" fill="#fff" font-size="13" font-weight="700">Audit log</text>
    <text x="980" y="146" fill="#e0e7ff" font-size="11">reason + features</text>
  </g>

  <g stroke="#94a3b8" stroke-width="2" fill="none">
    <path d="M170 131 H200"/>
    <path d="M340 131 H370"/>
    <path d="M500 97 H540"/>
    <path d="M500 165 H540"/>
    <path d="M690 97 H720"/>
    <path d="M690 165 H720"/>
    <path d="M870 97 H900"/>
    <path d="M870 165 H900"/>
  </g>
  <text x="36" y="230" fill="#64748b" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">Blue boxes may use AI. Orange gate never does. Red forced actions always win.</text>
</svg>
